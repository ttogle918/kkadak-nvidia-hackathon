[project]
name = "nvidia-hackathon"
version = "0.1.0"
description = "NVIDIA 에이전트 스택(OpenShell · NemoClaw · Agent Skills) 위의 해커톤 프로젝트"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "mcp>=1.2",
    "openai>=1.60",          # Nemotron 은 OpenAI 호환 — 샌드박스 안에서는 base_url=https://inference.local
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude/skills"]   # NVIDIA 카탈로그 스킬 — 우리 코드가 아님

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
