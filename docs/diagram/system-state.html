<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-Context 현재 상태 다이어그램</title>
<style>
:root{--bg:#f6f2ea;--paper:#fffdf8;--ink:#1d1b16;--sub:#5d574a;--line:#cfc6b2;--lane:#fbf7ee;
 --ok:#2d6a4f;--okbg:#e6f2ea;--ai:#2f5d7c;--aibg:#e4eef6;--part:#a15c07;--partbg:#fbefd9;--no:#a02c2c;--nobg:#f9e3e3;--mock:#6b6558;--mockbg:#ece8dd;--ext:#5b4a8a;--extbg:#ece7f6}
@media (prefers-color-scheme: dark){:root{--bg:#14120e;--paper:#1d1a14;--ink:#f3ede0;--sub:#b9b09c;--line:#3a3427;--lane:#181510;
 --ok:#7bc49c;--okbg:#17261f;--ai:#7fb2d6;--aibg:#16222c;--part:#e3a64a;--partbg:#2b2112;--no:#e58b8b;--nobg:#2c1717;--mock:#b3ab98;--mockbg:#26231b;--ext:#b8a5e6;--extbg:#211b30}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
main{max-width:1360px;margin:0 auto;padding:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px;overflow-x:auto}
svg{width:100%;height:auto;min-width:1000px;display:block}
.lane{fill:var(--lane);stroke:var(--line)} .lane.sb{stroke-dasharray:6 4}
.lh{font-size:14px;font-weight:700;fill:var(--sub)} .title{font-size:20px;font-weight:800;fill:var(--ink)}
.b rect,rect.b{stroke-width:1.6}
.ok rect,rect.ok{fill:var(--okbg);stroke:var(--ok)} .ai rect,rect.ai{fill:var(--aibg);stroke:var(--ai)}
.part rect,rect.part{fill:var(--partbg);stroke:var(--part)} .no rect,rect.no{fill:var(--nobg);stroke:var(--no);stroke-dasharray:5 3}
.mock rect,rect.mock{fill:var(--mockbg);stroke:var(--mock);stroke-dasharray:2 3} .ext rect{fill:var(--extbg);stroke:var(--ext)}
.t{font-size:14px;font-weight:700;fill:var(--ink)} .s{font-size:12px;fill:var(--sub)} .tag{font-size:11px;font-weight:800;fill:var(--ai)}
.a{fill:none;stroke:var(--sub);stroke-width:1.6} .a.d{stroke-dasharray:5 4} .ahp{fill:var(--sub)} .al{font-size:11px;fill:var(--sub)}
.note{max-width:1100px;margin:14px auto 0;font-size:14px;line-height:1.6;color:var(--sub)} .note b{color:var(--ink)}
@media print{body{background:#fff} svg{min-width:0}}
</style></head><body><main>
<div class="card"><svg viewBox="0 0 1300 1040" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="K-Context 현재 상태 다이어그램"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><text class="title" x="16" y="30">K-Context — 현재 상태 다이어그램 (2026-10-07)</text><g transform="translate(16,44)"><rect class="b ok" x="0" y="2" width="14" height="14" rx="3"/><text class="s" x="20" y="14">동작 확인</text><rect class="b ai" x="100" y="2" width="14" height="14" rx="3"/><text class="s" x="120" y="14">AI(모델) 호출</text><rect class="b part" x="236" y="2" width="14" height="14" rx="3"/><text class="s" x="256" y="14">부분 / 미검증</text><rect class="b no" x="376" y="2" width="14" height="14" rx="3"/><text class="s" x="396" y="14">미구현 / 데이터 없음</text><rect class="b mock" x="556" y="2" width="14" height="14" rx="3"/><text class="s" x="576" y="14">MOCK (가짜 데이터)</text></g><rect class="lane" x="16" y="76" width="250" height="672" rx="14"/><text class="lh" x="30" y="100">① 사용자 · 브라우저 화면</text><rect class="lane" x="286" y="76" width="270" height="672" rx="14"/><text class="lh" x="300" y="100">② 백엔드 (FastAPI)</text><rect class="lane" x="576" y="76" width="320" height="672" rx="14"/><text class="lh" x="590" y="100">③ 에이전트 파이프라인 (별도 프로세스)</text><rect class="lane" x="916" y="76" width="368" height="672" rx="14"/><text class="lh" x="930" y="100">④ 호스트 전용 수집 · 외부 (샌드박스 밖)</text><g class="b ok"><rect x="30" y="116" width="222" height="70" rx="10"/><text class="t" x="42" y="138">채팅 입력</text><text class="s" x="42" y="158">“10/15에 창덕궁 10시,</text><text class="s" x="42" y="175">익선동 2시, 숙소는 종로3가야”</text></g><g class="b ok"><rect x="30" y="430" width="222" height="52" rx="10"/><text class="t" x="42" y="452">타임라인 (챗봇이 정리한 일정)</text><text class="s" x="42" y="472">가정·확인 필요 문구 표시</text></g><g class="b ok"><rect x="30" y="494" width="222" height="52" rx="10"/><text class="t" x="42" y="516">지도 핀 + 정보창</text><text class="s" x="42" y="536">좌표 검증된 장소만</text></g><g class="b ok"><rect x="30" y="558" width="222" height="66" rx="10"/><text class="t" x="42" y="580">실록 원문 카드</text><text class="s" x="42" y="600">한문 원문 · 한글 요약(원문 아님)</text><text class="s" x="42" y="617">출처 태그 · 원문 링크</text></g><g class="b part"><rect x="30" y="636" width="222" height="56" rx="10"/><text class="t" x="42" y="658">행사 카드</text><text class="s" x="42" y="678">데이터 0건 → “아직 없음”</text></g><g class="b mock"><rect x="30" y="700" width="222" height="44" rx="10"/><text class="t" x="42" y="720">MOCK 영역</text><text class="s" x="42" y="736">경로 A·B·C · 옛날 카드 · 판단 근거</text></g><g class="b ok"><rect x="300" y="116" width="242" height="56" rx="10"/><text class="t" x="312" y="138">POST /api/messages</text><text class="s" x="312" y="158">{text, context: trip}</text></g><g class="b ok"><rect x="300" y="188" width="242" height="62" rx="10"/><text class="t" x="312" y="210">입력 가드</text><text class="s" x="312" y="230">주입·허용 밖 경로 차단 → 거부+로그</text></g><g class="b ok"><rect x="300" y="266" width="242" height="56" rx="10"/><text class="t" x="312" y="288">일정 판별 게이트 (규칙)</text><text class="s" x="312" y="308">시각·날짜 표현 + 일정 어휘/장소</text></g><g class="b ai"><rect x="300" y="340" width="242" height="72" rx="10"/><text class="t" x="312" y="362">일반 챗봇 (Nemotron)</text><text class="s" x="312" y="382">호스트에서 직접 호출 · 근거 없음</text><text class="s" x="312" y="399">“출처 없는 일반 안내” 문구 부착</text><text class="tag" x="532" y="358" text-anchor="end">AI</text></g><g class="b part"><rect x="300" y="434" width="242" height="64" rx="10"/><text class="t" x="312" y="456">행사 검색 (카탈로그)</text><text class="s" x="312" y="476">같은 일정으로 /events/search</text><text class="s" x="312" y="493">데이터 0건 · 실패 시 null+사유</text></g><g class="b ok"><rect x="300" y="516" width="242" height="56" rx="10"/><text class="t" x="312" y="538">응답 조립 {reply, logs, bundle}</text><text class="s" x="312" y="558">서버 고정 문구(LLM 문장 아님)</text></g><g class="b mock"><rect x="300" y="590" width="242" height="56" rx="10"/><text class="t" x="312" y="612">/api/cards·sources·rationale</text><text class="s" x="312" y="632">fixture (= mock 과 같은 내용)</text></g><g class="b ok"><rect x="300" y="662" width="242" height="52" rx="10"/><text class="t" x="312" y="684">감사 · 승인 API</text><text class="s" x="312" y="704">상태 전이는 사람 전용(D2)</text></g><g class="b ok"><rect x="590" y="106" width="292" height="58" rx="10"/><text class="t" x="602" y="128">입력 글 = 신뢰할 수 없는 데이터</text><text class="s" x="602" y="148">길이 제한 · 주입 차단 후 “데이터”로만 전달</text></g><g class="b ai"><rect x="590" y="176" width="292" height="70" rx="10"/><text class="t" x="602" y="198">① 일정 이해 — LLM 호출</text><text class="s" x="602" y="218">후보: 이름·시각·날짜 + 원문 인용(quote)</text><text class="s" x="602" y="235">⚠ 간헐적 실패/60초 타임아웃 → 폴백</text><text class="tag" x="872" y="194" text-anchor="end">AI</text></g><g class="b ok"><rect x="590" y="262" width="292" height="82" rx="10"/><text class="t" x="602" y="284">② 검증·계산 — 코드(모델 아님)</text><text class="s" x="602" y="304">인용이 입력에 없으면 버림 · 값은 인용 안에서만</text><text class="s" x="602" y="321">빈 시간은 코드가 계산 · 오전/오후 가정 표시</text></g><g class="b ok"><rect x="590" y="360" width="292" height="56" rx="10"/><text class="t" x="602" y="382">③ 좌표 사전 (검증된 5곳)</text><text class="s" x="602" y="402">사전에 없으면 lat/lng = null (지어내지 않음)</text></g><g class="b ok"><rect x="590" y="432" width="292" height="70" rx="10"/><text class="t" x="602" y="454">④ 실록 언급 찾기 — LLM 없음</text><text class="s" x="602" y="474">앵커 이름으로 FTS5 검색 · 왕대 다양화</text><text class="s" x="602" y="491">한문 원문 구절 + 링크, 없으면 “없음”</text></g><g class="b ok"><rect x="590" y="518" width="292" height="60" rx="10"/><text class="t" x="602" y="540">bundle.json (kc-chat-bundle/v1)</text><text class="s" x="602" y="560">일정 · 언급 · cards · problems · coverage_note</text></g><g class="b ok"><rect x="590" y="596" width="292" height="142" rx="10"/><text class="t" x="602" y="618">LLM 을 믿지 않는 지점 (가드)</text><text class="s" x="602" y="638">• 값은 원문 인용이 있을 때만 인정</text><text class="s" x="602" y="655">• 시간·빈 구간 계산은 코드</text><text class="s" x="602" y="672">• 좌표는 사전에서만, 없으면 null</text><text class="s" x="602" y="689">• 실록은 번역·요약하지 않고 원문 그대로</text><text class="s" x="602" y="706">• 출처 태그 / “미확인” 표시 / 모르면 비움</text></g><g class="b ok"><rect x="930" y="116" width="340" height="76" rx="10"/><text class="t" x="942" y="138">실록 XML 673개 → 수집기 → FTS5 색인</text><text class="s" x="942" y="158">DOCTYPE 검사(D14) · 38만 기사 → 4개 구 키워드</text><text class="s" x="942" y="175">청크 7,713개 · 에이전트는 이 색인만 읽음</text></g><g class="b no"><rect x="930" y="208" width="340" height="48" rx="10"/><text class="t" x="942" y="230">서울 열린데이터광장 행사</text><text class="s" x="942" y="250">API 키 없음 → 수집 안 됨</text></g><g class="b part"><rect x="930" y="272" width="340" height="64" rx="10"/><text class="t" x="942" y="294">Tavily 검색 → LLM 추출 → 카탈로그</text><text class="s" x="942" y="314">코드 초안(WIP) · 테스트/실호출 검증 없음</text><text class="s" x="942" y="331">산출 데이터 0건</text><text class="tag" x="1260" y="290" text-anchor="end">AI</text></g><g class="b part"><rect x="930" y="352" width="340" height="64" rx="10"/><text class="t" x="942" y="374">팀원 PR: now 카드 · 도보 시간(geo)</text><text class="s" x="942" y="394">코드·테스트 있음, 화면 연결은 아직</text></g><g class="b ext"><rect x="930" y="432" width="340" height="56" rx="10"/><text class="t" x="942" y="454">NVIDIA 추론 (Nemotron)</text><text class="s" x="942" y="474">호스트: .env 키 · 샌드박스: inference.local</text></g><g class="b no"><rect x="930" y="504" width="340" height="70" rx="10"/><text class="t" x="942" y="526">아직 없는 것</text><text class="s" x="942" y="546">한글→한자 별칭 사전 · 옛길 선 · 평가셋</text><text class="s" x="942" y="563">이야기 문장(narration) · 일정/경로 API</text></g><rect class="lane sb" x="16" y="764" width="1268" height="250" rx="14"/><text class="lh" x="30" y="788">⑤ OpenShell 샌드박스 kcontext — 공통 테스트(연습 요청) 경로 · 22항목 실측</text><g class="b ok"><rect x="30" y="802" width="300" height="92" rx="10"/><text class="t" x="42" y="824">정책 policy.kculture.yaml</text><text class="s" x="42" y="844">network_policies 비움 → 외부 전부 DENIED</text><text class="s" x="42" y="861">쓰기 /tmp 만 · restricted·secrets 미탑재</text><text class="s" x="42" y="878">키 0건 (환경변수 확인)</text></g><g class="b ai"><rect x="344" y="802" width="300" height="92" rx="10"/><text class="t" x="356" y="824">에이전트 scripts/kculture_practice.py</text><text class="s" x="356" y="844">input 읽기 → inference.local → output</text><text class="s" x="356" y="861">문서 속 지시는 데이터로만 처리</text><text class="s" x="356" y="878">초안만(예약·발송 안 함)</text><text class="tag" x="634" y="820" text-anchor="end">AI</text></g><g class="b ok"><rect x="658" y="802" width="300" height="92" rx="10"/><text class="t" x="670" y="824">inference.local (게이트웨이)</text><text class="s" x="670" y="844">게이트웨이가 키 주입 → NVIDIA 추론</text><text class="s" x="670" y="861">샌드박스가 뚫려도 가져갈 키 없음(D1)</text></g><g class="b part"><rect x="972" y="802" width="300" height="92" rx="10"/><text class="t" x="984" y="824">알려진 한계</text><text class="s" x="984" y="844">입력 읽기 전용은 정책이 아니라 chmod</text><text class="s" x="984" y="861">챗봇은 아직 샌드박스 밖(B1 미결정)</text><text class="s" x="984" y="878">샌드박스 안 NemoClaw 에이전트 미연결</text></g><text class="s" x="30" y="922">실측 22항목: 외부 접속 DENIED(example.com·github.com·업로드·메일) · inference.local ALLOWED · /tmp 밖 쓰기 Permission denied · 환경변수 키 0건</text><text class="s" x="30" y="944">연습 요청 결과(수동 1회): 최신 공식 자료 우선 · 홍보 문구·낡은 캐시·무관 문서 제외 · 알레르기 반영 · 외부 지시 무시</text><path class="a" d="M141,186 L141,218 L300,218" marker-end="url(#ah)"/><text class="al" x="200" y="212">POST</text><path class="a" d="M421,250 L421,266" marker-end="url(#ah)"/><path class="a" d="M421,322 L421,340" marker-end="url(#ah)"/><text class="al" x="428" y="334">아니오</text><path class="a" d="M542,294 L560,294 L560,135 L590,135" marker-end="url(#ah)"/><text class="al" x="546" y="288">예</text><path class="a" d="M736,164 L736,176" marker-end="url(#ah)"/><path class="a" d="M736,246 L736,262" marker-end="url(#ah)"/><path class="a" d="M736,344 L736,360" marker-end="url(#ah)"/><path class="a" d="M736,416 L736,432" marker-end="url(#ah)"/><path class="a" d="M736,502 L736,518" marker-end="url(#ah)"/><path class="a" d="M590,548 L560,548 L560,466 L542,466" marker-end="url(#ah)"/><text class="al" x="562" y="520">bundle</text><path class="a" d="M421,498 L421,516" marker-end="url(#ah)"/><path class="a" d="M300,376 L292,376 L292,544 L300,544" marker-end="url(#ah)"/><path class="a" d="M300,544 L276,544 L276,456 L252,456" marker-end="url(#ah)"/><path class="a" d="M300,544 L270,544 L270,520 L252,520" marker-end="url(#ah)"/><path class="a" d="M300,544 L270,544 L270,590 L252,590" marker-end="url(#ah)"/><path class="a" d="M930,154 L906,154 L906,467 L882,467" marker-end="url(#ah)"/><text class="al" x="878" y="430">색인 읽기</text><path class="a" d="M882,211 L926,211 L926,454 L930,454" marker-end="url(#ah)"/><text class="al" x="898" y="222">LLM</text></svg></div>
<div class="note"><b>읽는 법</b> — 왼쪽에서 오른쪽으로: 사용자 문장 → 백엔드(가드·판별) → 별도 프로세스의 에이전트 파이프라인(AI 호출 1곳 + 코드 검증) → <b>bundle</b> → 화면.
<b>AI 가 하는 일</b>은 “일정 글에서 후보 추출”뿐이고, 그 값은 <b>원문 인용이 확인될 때만</b> 쓰며 시간 계산·좌표·실록 검색은 코드/색인이 한다. 실록은 번역하지 않고 원문을 그대로 보여 준다.
<b>MOCK</b> 표시는 가짜 데이터(경로·옛날 카드·판단 근거·보안 로그 UI)다. 행사는 데이터 0건, Tavily 수집은 미검증. 수치는 2026-10-07 직접 실행·실측 기준.</div>
