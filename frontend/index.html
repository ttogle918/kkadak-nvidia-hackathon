<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홈 · 에이전트 콘솔</title>
<style>
/* ================= COMMON v1 — 모든 페이지에서 글자 그대로 동일 ================= */
:root,[data-theme="dark"]{
  --bg-0:#08080a;--bg-1:#0e0e11;--bg-2:#131317;--bg-3:#1a1a1f;--bg-4:#222228;
  --line:#2a2a31;--line-2:#454550;--divider:rgba(255,255,255,.09);
  --tx-1:#f2f2f6;--tx-2:#c2c2cc;--tx-3:#9c9ca8;
  --accent:#ff4d6d;--accent-2:#ff1f4b;--accent-tx:#ff6683;--accent-dim:rgba(255,31,75,.16);--on-accent:#fff;
  --accent-shadow:0 3px 12px rgba(255,31,75,.32);
  --positive:#76b900;--positive-2:#86cc00;--on-positive:#0a0b0f;--positive-shadow:0 3px 12px rgba(118,185,0,.3);
  --crit:#f04141;--crit-tx:#ff7676;--crit-dim:rgba(240,65,65,.12);
  --high:#f59e0b;--high-tx:#fbbf24;--high-dim:rgba(245,158,11,.12);
  --med:#eab308;--med-tx:#facc15;--med-dim:rgba(234,179,8,.10);
  --low:#76b900;--low-tx:#8fd400;--low-dim:rgba(118,185,0,.12);
  --info:#569cd6;--info-tx:#8cc0ee;--info-dim:rgba(86,156,214,.12);
  /* 출처 상태 — 브랜드 주황과 겹치지 않게 정의 */
  --pv-un-fg:#e2e2ea;--pv-un-bg:rgba(226,226,234,.06);--pv-un-bd:#a0a0ac;--pv-un-hatch:rgba(255,255,255,.08);
  --pv-dr-fg:#67e8f9;--pv-dr-bg:rgba(34,211,238,.10);--pv-dr-bd:#22d3ee;
  --pv-ap-fg:#8fd400;--pv-ap-bg:rgba(118,185,0,.14);--pv-ap-bd:#76b900;
  --pv-bk-fg:#ff7676;--pv-bk-bg:rgba(240,65,65,.15);--pv-bk-bd:#f04141;
  --pv-ne-fg:#c4b5fd;--pv-ne-bg:rgba(167,139,250,.12);--pv-ne-bd:#a78bfa;
  --pv-se-fg:#fde047;--pv-se-bg:rgba(234,179,8,.10);--pv-se-bd:#eab308;--pv-se-hatch:rgba(234,179,8,.16);
  --ink:#f2f2f6;--on-ink:#0a0a0d;
  --font-sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono","D2Coding",Consolas,"Liberation Mono",monospace;
  --fs-xs:13px;--fs-sm:14px;--fs-base:16px;--fs-md:18px;--fs-lg:22px;--fs-xl:30px;--fs-2xl:40px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
  --r-sm:4px;--r-md:8px;--r-lg:10px;--r-xl:14px;
  --t-hover:150ms ease-out;--t-panel:250ms cubic-bezier(.4,0,.2,1);
  --sidebar-w:240px;--rail-w:80px;--top-h:60px;--tab-h:64px;--touch:48px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg-0:#e7e9ee;--bg-1:#ffffff;--bg-2:#ffffff;--bg-3:#f1f2f5;--bg-4:#e4e6eb;
  --line:#c3c7cf;--line-2:#8a8f9b;--divider:rgba(0,0,0,.12);
  --tx-1:#0a0b0f;--tx-2:#2c2e37;--tx-3:#474a55;
  --accent:#ff1f4b;--accent-2:#d9123b;--accent-tx:#b30f31;--accent-dim:rgba(255,31,75,.10);
  --positive:#76b900;--positive-2:#6aa600;--on-positive:#0a0b0f;--positive-shadow:0 3px 12px rgba(118,185,0,.35);
  --crit:#dc2626;--crit-tx:#a51616;--crit-dim:#fde6e6;
  --high:#d97706;--high-tx:#8a4b00;--high-dim:#fdf0d8;
  --med:#ca8a04;--med-tx:#6b4a00;--med-dim:#fdf6d4;
  --low:#5f9600;--low-tx:#3d6100;--low-dim:#eef6dc;
  --info:#2563eb;--info-tx:#1d4fa8;--info-dim:#e3ecfb;
  --pv-un-fg:#22242c;--pv-un-bg:#eeeff2;--pv-un-bd:#5a5e69;--pv-un-hatch:rgba(0,0,0,.07);
  --pv-dr-fg:#075a6b;--pv-dr-bg:#def5fa;--pv-dr-bd:#0e93ad;
  --pv-ap-fg:#3d6100;--pv-ap-bg:#eef6dc;--pv-ap-bd:#5f9600;
  --pv-bk-fg:#9f1414;--pv-bk-bg:#fde4e4;--pv-bk-bd:#dc2626;
  --pv-ne-fg:#55209f;--pv-ne-bg:#eee8ff;--pv-ne-bd:#7c3aed;
  --pv-se-fg:#5e4100;--pv-se-bg:#fdf2c9;--pv-se-bd:#b98900;--pv-se-hatch:rgba(185,137,0,.16);
  --ink:#0a0b0f;--on-ink:#ffffff;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg-0);color:var(--tx-1);font-family:var(--font-sans);font-size:var(--fs-base);line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
a{color:var(--accent-tx);text-decoration:none;font-weight:600}
a:hover{color:var(--accent);text-decoration:underline}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
code,pre,.mono{font-family:var(--font-mono)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
*:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 앱 셸 */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);height:100vh;height:100dvh}
.sidebar{background:var(--bg-1);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:var(--sal)}
.sb-brand{display:flex;align-items:center;gap:10px;height:var(--top-h);padding:0 18px;font-weight:800;font-size:17px;border-bottom:1px solid var(--line);flex:none}
.sb-mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-2);color:#fff}
.sb-mark .ic{width:18px;height:18px}
.sb-nav{flex:1;overflow-y:auto;padding:10px}
.sb-grp{font-size:var(--fs-xs);font-weight:700;color:var(--tx-3);letter-spacing:.04em;padding:14px 12px 6px}
.sb-link{display:flex;align-items:center;gap:12px;min-height:var(--touch);padding:0 12px;border-radius:var(--r-md);color:var(--tx-2);font-weight:600;font-size:var(--fs-base);transition:background var(--t-hover),color var(--t-hover)}
.sb-link:hover{background:var(--bg-3);color:var(--tx-1);text-decoration:none}
.sb-link[aria-current="page"]{background:var(--accent-dim);color:var(--accent-tx)}
.sb-link .lbl-s{display:none}
.sb-count{margin-left:auto;min-width:26px;height:24px;padding:0 7px;border-radius:12px;background:var(--accent-2);color:#fff;font-size:var(--fs-xs);font-weight:800;display:grid;place-items:center;font-family:var(--font-mono)}
.sb-foot{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;flex:none}
.sb-legend{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sb-user{display:flex;align-items:center;gap:10px;font-weight:700;font-size:var(--fs-sm)}
.sb-user small{display:block;font-family:var(--font-mono);color:var(--tx-3);font-weight:600;font-size:var(--fs-xs)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:800;flex:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.topbar{display:flex;align-items:center;gap:10px;min-height:var(--top-h);padding:var(--sat) calc(16px + var(--sar)) 0 20px;background:var(--bg-1);border-bottom:1px solid var(--line);flex:none}
.tb-crumb{display:flex;align-items:center;gap:6px;min-width:0;font-weight:700;font-size:var(--fs-md)}
.tb-crumb .sep{color:var(--tx-3)}
.tb-crumb .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-mono);font-size:var(--fs-base)}
.tb-mobile-brand{display:none}
.tb-sp{flex:1}
.net{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:700;color:var(--tx-2);padding:0 10px;height:36px;border-radius:18px;border:1px solid var(--line)}
.net i{width:10px;height:10px;border-radius:50%;background:var(--low)}
.net.off{color:var(--high-tx);border-color:var(--high)}.net.off i{background:var(--high)}
.icon-btn{width:var(--touch);height:var(--touch);border-radius:var(--r-md);border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--tx-2);transition:background var(--t-hover)}
.icon-btn:hover{background:var(--bg-3);color:var(--tx-1)}
.netbar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--high-dim);color:var(--high-tx);font-weight:700;border-bottom:2px solid var(--high);flex:none;font-size:var(--fs-sm)}
.netbar[hidden]{display:none}
.tabbar{display:none}

/* 버튼 */
.btn{min-height:var(--touch);padding:0 18px;border-radius:var(--r-md);border:1.5px solid var(--line-2);background:var(--bg-3);color:var(--tx-1);font-weight:700;font-size:var(--fs-base);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background var(--t-hover),border-color var(--t-hover),color var(--t-hover);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--bg-4);border-color:var(--tx-3);text-decoration:none;color:var(--tx-1)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent-2);border-color:var(--accent-2);color:var(--on-accent);box-shadow:var(--accent-shadow)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-positive{background:var(--positive);border-color:var(--positive);color:var(--on-positive);box-shadow:var(--positive-shadow)}
.btn-positive:hover{background:var(--positive-2);border-color:var(--positive-2);color:var(--on-positive)}
.btn-positive .reauth{background:rgba(0,0,0,.18);color:var(--on-positive)}
.btn-danger{color:var(--crit-tx);border-color:var(--crit)}
.btn-danger:hover{background:var(--crit-dim);color:var(--crit-tx);border-color:var(--crit)}
.btn-ghost{background:transparent;border-color:transparent}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.42;cursor:not-allowed;box-shadow:none;transform:none}
.btn-sm{min-height:40px;padding:0 12px;font-size:var(--fs-sm)}
.reauth{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:2px 7px;border-radius:var(--r-sm);background:rgba(0,0,0,.28);color:#fff;font-family:var(--font-mono);letter-spacing:.02em}
.reauth .ic{width:13px;height:13px}
.reauth-o{background:transparent;border:1.5px solid currentColor;color:var(--tx-1)}

/* 심각도 배지 */
.sev{display:inline-flex;align-items:center;height:28px;padding:0 9px;border-radius:var(--r-sm);font-family:var(--font-mono);font-weight:800;font-size:var(--fs-xs);letter-spacing:.05em;border:1.5px solid}
.sev-CRITICAL{color:var(--crit-tx);background:var(--crit-dim);border-color:var(--crit)}
.sev-HIGH{color:var(--high-tx);background:var(--high-dim);border-color:var(--high)}
.sev-MEDIUM{color:var(--med-tx);background:var(--med-dim);border-color:var(--med)}
.sev-LOW{color:var(--low-tx);background:var(--low-dim);border-color:var(--low)}

/* 출처 상태 배지 — 키트의 정체성. 색 + 아이콘 + 라벨 + 테두리 형태 4중 구분 */
.pv{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:3px 11px;border-radius:var(--r-md);font-weight:800;font-size:var(--fs-sm);line-height:1.2;border-width:2px;border-style:solid;max-width:100%}
.pv .ic{width:18px;height:18px;stroke-width:2.2}
.pv-l{white-space:nowrap}
.pv-x{font-weight:600;font-family:var(--font-mono);font-size:var(--fs-xs);opacity:.95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pv-untrusted{color:var(--pv-un-fg);border-color:var(--pv-un-bd);border-style:dashed;background:repeating-linear-gradient(135deg,var(--pv-un-hatch) 0 5px,transparent 5px 10px),var(--pv-un-bg)}
.pv-draft{color:var(--pv-dr-fg);border-color:var(--pv-dr-bd);border-style:dashed;background:var(--pv-dr-bg)}
.pv-approved{color:var(--pv-ap-fg);border-color:var(--pv-ap-bd);background:var(--pv-ap-bg)}
.pv-blocked{color:var(--pv-bk-fg);border-color:var(--pv-bk-bd);background:var(--pv-bk-bg)}
.pv-noev{color:var(--pv-ne-fg);border-color:var(--pv-ne-bd);border-style:dotted;background:var(--pv-ne-bg)}
.pv-sensor{color:var(--pv-se-fg);border-color:var(--pv-se-bd);border-style:dashed;background:repeating-linear-gradient(135deg,var(--pv-se-hatch) 0 5px,transparent 5px 10px),var(--pv-se-bg)}
.pv-sm{min-height:26px;padding:2px 8px;font-size:12.5px;gap:5px;border-width:1.5px}
.pv-sm .ic{width:15px;height:15px}
.pv-lg{min-height:40px;padding:4px 14px;font-size:var(--fs-base)}
.pv-lg .ic{width:22px;height:22px}
/* 출처 상태 박스 */
.pvbox{border-radius:var(--r-lg);border:1.5px solid var(--line);background:var(--bg-2)}
.pvbox-untrusted{border:2px dashed var(--pv-un-bd)}
.pvbox-draft{border:2px dashed var(--pv-dr-bd)}
.pvbox-approved{border:2px solid var(--pv-ap-bd)}
.pvbox-blocked{border:2px solid var(--pv-bk-bd);background:var(--pv-bk-bg)}
.pvbox-noev{border:2px dotted var(--pv-ne-bd)}
.pvbox-sensor{border:2px dashed var(--pv-se-bd)}
.pvbox-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--divider)}
.pvbox-untrusted>.pvbox-head{background:repeating-linear-gradient(135deg,var(--pv-un-hatch) 0 5px,transparent 5px 10px)}
.pvbox-body{padding:12px}

/* 근거 인용 */
.cite{border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--bg-3);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cite-top{display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--fs-sm);flex-wrap:wrap}
.cite-top .ic{width:17px;height:17px;color:var(--tx-2)}
.cite-loc{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--tx-2);font-weight:700}
.cite-q{margin:0;font-family:var(--font-mono);font-size:var(--fs-sm);line-height:1.55;color:var(--tx-1)}
.cite-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.cite-link{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-sm);min-height:32px}
.cite-link .ic{width:15px;height:15px}

/* 사람 전용 영역 */
.human-tag{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:var(--r-md);background:var(--ink);color:var(--on-ink);font-weight:800;font-size:var(--fs-sm);white-space:nowrap}
.human-tag .ic{width:18px;height:18px;stroke-width:2.3}
.human-bar{flex:none;display:flex;align-items:center;gap:16px;padding:12px calc(20px + var(--sar)) 12px 20px;background:var(--bg-1);border-top:3px solid var(--ink);position:relative;z-index:20}
.hb-id{display:flex;align-items:center;gap:12px;min-width:0}
.hb-cap{font-size:var(--fs-sm);color:var(--tx-2);font-weight:600;min-width:0}
.hb-actions{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.lbl-short{display:none}

/* 상태 화면 */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 16px;color:var(--tx-2)}
.empty-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--bg-3);border:1.5px solid var(--line-2);color:var(--tx-2)}
.empty-ic .ic{width:28px;height:28px}
.empty h3{color:var(--tx-1);font-size:var(--fs-md)}
.empty p{max-width:340px;font-weight:500}
.sk{background:linear-gradient(90deg,var(--bg-3) 0%,var(--bg-4) 50%,var(--bg-3) 100%);background-size:200% 100%;animation:shimmer 1.5s linear infinite;border-radius:var(--r-md)}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .85s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--r-lg);font-weight:600}
.alert .ic{width:24px;height:24px;margin-top:1px}
.alert b{display:block;font-size:var(--fs-base)}
.alert-blocked{background:var(--pv-bk-bg);border:2px solid var(--pv-bk-bd);color:var(--pv-bk-fg)}
.alert-error{background:var(--high-dim);border:2px solid var(--high);color:var(--high-tx)}
.alert-ok{background:var(--pv-ap-bg);border:2px solid var(--pv-ap-bd);color:var(--pv-ap-fg)}
.alert p{color:var(--tx-1);font-size:var(--fs-sm);font-weight:500}

/* 모달 · 시트 · 토스트 */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.modal{width:min(520px,100%);max-height:calc(100dvh - 40px);overflow-y:auto;background:var(--bg-2);border:1.5px solid var(--line-2);border-radius:var(--r-xl);padding:22px;display:flex;flex-direction:column;gap:16px}
.modal h2{font-size:var(--fs-lg)}
.modal-x{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:var(--fs-sm)}
.input{min-height:52px;border-radius:var(--r-md);border:1.5px solid var(--line-2);background:var(--bg-4);color:var(--tx-1);padding:12px 14px;font:inherit;font-size:var(--fs-base);width:100%}
textarea.input{min-height:110px;resize:vertical}
.input:focus{border-color:var(--accent-2);outline:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line-2);background:var(--bg-3);font-weight:700;font-size:var(--fs-sm);cursor:pointer}
.legend-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--divider)}
.legend-row p{font-size:var(--fs-sm);color:var(--tx-2);font-weight:500}
.sheet-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-nav a{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px;border-radius:var(--r-md);background:var(--bg-3);color:var(--tx-1);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(110px + var(--sab));transform:translateX(-50%);z-index:300;background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:var(--r-lg);font-weight:700;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast[hidden]{display:none}

/* 데모 상태 전환 */
.demo{position:fixed;left:calc(var(--sidebar-w) + 14px);bottom:var(--float-b,20px);z-index:150;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:var(--fs-xs)}
.demo-pill{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--tx-2);font-family:var(--font-mono);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;opacity:.85}

function chatMsgHTML(m) {
  if (m.role === "user") return `<div class="msg-u">${esc(m.text)}</div>`;
  const cls = m.kind === "refuse" ? " refuse" : m.kind === "block" ? " block" : "";
  const badge = m.kind === "refuse" ? pv("noev", "답변 거부", "sm") : m.kind === "block" ? pv("blocked", "사람 전용", "sm") : pv("draft", "답변은 초안", "sm");
  const tools = (m.tools || []).map(t => `<span class="msg-tool">${t.done ? ic("check") : '<span class="spin" style="width:12px;height:12px;border-width:2px"></span>'}${esc(t.name)} · ${t.done ? esc(t.dur) : "실행 중"}</span>`).join("");
  const txt = m.done ? m.text : m.shown;
  return `<div class="msg-a${cls}"><div style="display:flex;gap:6px;flex-wrap:wrap">${badge}</div>${tools ? `<div class="msg-tools">${tools}</div>` : ""}${txt || m.streaming ? `<p class="msg-t">${esc(txt)}${m.streaming ? '<span class="caret"></span>' : ""}</p>` : ""}${m.done && m.cites ? `<div class="msg-cites">${m.cites.map(c => `<span class="msg-cite">${ic("knowledge")}${esc(c)}</span>`).join("")}</div>` : ""}${m.done && m.link ? `<a class="btn btn-sm" href="${m.link[0]}" style="align-self:flex-start">${esc(m.link[1])}${ic("chev")}</a>` : ""}</div>`;
}
function renderChat() {
  const C = DATA.chat || { ctx: "", suggestions: [] };
  $("#chat-root").innerHTML = `<button class="fab" data-act="chat-toggle" aria-label="에이전트 어시스턴트 열기"${CHAT.open ? " hidden" : ""}>${ic("chat")}</button>
  <section class="chat" role="dialog" aria-label="에이전트 어시스턴트"${CHAT.open ? "" : " hidden"}>
    <div class="chat-h"><span class="sb-mark">${ic("bot")}</span><div style="min-width:0;flex:1"><b>에이전트 어시스턴트</b><div class="chat-ctx">${esc(C.ctx)}</div></div><button class="icon-btn" data-act="chat-toggle" aria-label="닫기">${ic("x")}</button></div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-sug">${(C.suggestions || []).map(s => `<button class="chip" data-act="chat-sug" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    <div class="chat-in"><button class="icon-btn chat-mic" data-act="chat-mic" aria-label="음성 입력">${ic("mic")}</button><textarea class="input" id="chat-input" rows="1" placeholder="질문을 입력하세요"></textarea><button class="btn btn-primary" data-act="chat-send" aria-label="보내기">${ic("send")}</button></div>
    <div class="chat-note">${ic("lock")}승인·결재·정책 적용은 채팅으로 할 수 없습니다</div>
  </section>`;
  renderChatLog();
}
function renderChatLog() {
  const log = $("#chat-log"); if (!log) return;
  log.innerHTML = CHAT.log.map(chatMsgHTML).join(""); log.scrollTop = log.scrollHeight;
  document.querySelectorAll('#chat-root [data-act="chat-sug"], #chat-root [data-act="chat-send"]').forEach(b => b.disabled = CHAT.busy);
  const mic = $("#chat-root .chat-mic"); if (mic) mic.classList.toggle("on", CHAT.listening);
  const inp = $("#chat-input"); if (inp) inp.placeholder = CHAT.listening ? "듣는 중…" : "질문을 입력하세요";
}
function chatSend(text) {
  text = (text || "").trim(); if (!text || CHAT.busy) return;
  const C = DATA.chat || { replies: [] };
  CHAT.log.push({ role: "user", text });
  const r = APPROVE_RE.test(text)
    ? { kind: "block", tools: [], text: "승인·결재·정책 적용은 사람만 할 수 있어 채팅으로는 처리하지 않습니다. 사람 전용 바에서 재로그인 후 진행하세요.", link: ["approvals.html", "승인 큐로 이동"] }
    : (C.replies || []).find(x => x.match.some(k => text.includes(k))) || { kind: "refuse", tools: [["kb.search_manual", "0.8s"]], text: "승격된 문서와 승인된 기록에서 이 질문의 근거를 찾지 못했습니다. 근거 없이 답하지 않습니다." };
  const m = { role: "agent", kind: r.kind || "answer", tools: [], text: r.text, shown: "", cites: r.cites, link: r.link, streaming: false, done: false };
  CHAT.log.push(m); CHAT.busy = true; renderChatLog();
  const tools = (r.tools || []).map(([name, dur]) => ({ name, dur, done: false }));
  let i = 0;
  const step = () => {
    if (i < tools.length) { m.tools.push(tools[i]); renderChatLog(); setTimeout(() => { tools[i].done = true; i++; renderChatLog(); step(); }, 650); return; }
    m.streaming = true; let n = 0;
    const t = setInterval(() => { n = Math.min(m.text.length, n + 3); m.shown = m.text.slice(0, n); renderChatLog(); if (n >= m.text.length) { clearInterval(t); m.streaming = false; m.done = true; CHAT.busy = false; renderChatLog(); } }, 30);
  };
  step();
}
Object.assign(COMMON_ACTS, {
  "chat-toggle": () => { CHAT.open = !CHAT.open; renderChat(); if (CHAT.open) { const i = $("#chat-input"); if (i) i.focus(); } },
  "chat-sug": el => chatSend(el.dataset.v),
  "chat-send": () => { const i = $("#chat-input"); chatSend(i.value); i.value = ""; },
  "chat-mic": () => { if (CHAT.listening) return; CHAT.listening = true; renderChatLog(); setTimeout(() => { CHAT.listening = false; const i = $("#chat-input"); const s = (DATA.chat && DATA.chat.suggestions || [])[0]; if (i && s) i.value = s; renderChatLog(); }, 1500); }
});
document.addEventListener("keydown", e => {
  if (e.target && e.target.id === "chat-input" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); COMMON_ACTS["chat-send"](); }
  if (e.key === "Escape" && CHAT.open) { CHAT.open = false; renderChat(); }
});
addEventListener("DOMContentLoaded", () => {
  const r = document.createElement("div"); r.id = "chat-root"; document.body.appendChild(r);
  const g = (DATA.chat && DATA.chat.greeting) || "현재 화면 기준으로 답합니다. 모든 답에 근거를 붙이고, 근거가 없으면 답하지 않습니다.";
  CHAT.log = [{ role: "agent", kind: "answer", text: g, done: true }];
  renderChat(); placeDemo();
});
addEventListener("resize", () => placeDemo());
/* ================= /COMMON JS v1 ================= */

/* ================= PAGE: home ================= */
const sk = (h, w) => `<div class="sk" style="height:${h}px;width:${w || "100%"}"></div>`;
const head = (k, icon, href) => `<a class="kc-h" href="${href}"><h2>${ic(icon)}${esc(LABELS.cards[k])}</h2>${ic("chev")}</a>`;
const emptyRow = t => `<div class="kc-empty">${ic("check")}${esc(t)}</div>`;

function cardApprovals(s) {
  const A = DATA.approvals;
  let items = A.items, count = A.count, reauth = A.reauth;
  if (s === "approved") { items = A.items.filter(x => x.id !== DATA.recentDecision.id); count = items.length; reauth = items.filter(x => x.reauth).length; }
  if (s === "empty") { items = []; count = 0; reauth = 0; }
  const done = s === "approved" ? `<div class="kc-tags">${pv("approved", `방금 ${DATA.recentDecision.id} ${DATA.recentDecision.type} · ${DATA.recentDecision.by} · ${DATA.recentDecision.at}`, "sm")}</div>` : "";
  return `<section class="kcard k-ap">${head("approvals", "approvals", "approvals.html")}
    <div class="kc-num"><b>${count}</b><span>재로그인 필요 ${reauth}${items.length ? ` · 최장 대기 ${esc(A.oldest)}` : ""}</span></div>${done}
    ${items.length ? `<ul class="rows">${items.map(x => `<li><a class="row" href="${x.href}"><span><span class="row-s">${esc(x.id)} · ${esc(x.type)} · ${esc(x.agent)}</span><span class="row-t">${esc(x.title)}</span></span>
      <span class="row-r"><span class="row-w${x.old ? " old" : ""}">${ic("clock")} ${esc(x.wait)}</span></span>
      <span class="row-tags">${pv("draft", null, "sm")}<span class="sev sev-${x.risk}">${x.risk}</span>${x.reauth ? `<span class="reauth reauth-o">${ic("lock")}재로그인</span>` : ""}</span></a></li>`).join("")}</ul>` : emptyRow("승인을 기다리는 초안이 없습니다")}
  </section>`;
}
function cardBlocked(s) {
  const B = DATA.blocked;
  let items = s === "empty" ? [] : s === "blocked" ? [DATA.blockedExtra, ...B.items] : B.items;
  return `<section class="kcard k-bk${s === "blocked" ? " is-alert" : ""}">${head("blocked", "ban", "audit.html?filter=blocked")}
    <div class="kc-num"><b>${items.length}</b><span>${esc(B.window)} · 주입 의심 ${items.filter(x => x.injection).length}</span></div>
    ${items.length ? `<ul class="rows">${items.map(x => `<li><a class="row" href="audit.html?filter=blocked"><span><span class="row-s">${esc(x.t)} · ${esc(x.caseId)}</span><span class="row-t mono">${esc(x.tool)}</span></span><span></span>
      <span class="row-tags">${pv("blocked", null, "sm")}${x.injection ? pv("untrusted", "주입 의심", "sm") : ""}</span><span class="row-s" style="grid-column:1/-1;margin:0">${esc(x.why)}</span></a></li>`).join("")}</ul>` : emptyRow("차단된 시도가 없습니다")}
  </section>`;
}
function cardCases(s) {
  let items = DATA.cases.items.map(x => ({ ...x }));
  if (s === "running") items.forEach(x => { x.status = "running"; x.note = x.id.endsWith("014") ? "수정 요청 반영 중" : x.note; });
  if (s === "blocked") items[0] = { ...items[0], status: "blocked", note: "정책 차단 2건 · 검토 필요" };
  if (s === "empty") items = [];
  const st = { running: `<span class="rp rp-run"><span class="spin"></span>실행 중</span>`, wait: `<span class="rp rp-wait">${ic("user")}사람 결정 대기</span>`, blocked: `<span class="rp rp-blk">${ic("ban")}차단</span>` };
  return `<section class="kcard k-case">${head("cases", "case", "case.html")}
    <div class="kc-num"><b>${items.length}</b><span>실행 중 ${items.filter(x => x.status === "running").length} · 대기 ${items.filter(x => x.status === "wait").length}</span></div>
    ${items.length ? `<ul class="rows">${items.map(x => `<li><a class="row" href="case.html?id=${x.id}"><span><span class="row-s">${esc(x.id)}</span><span class="row-t">${esc(x.title)}</span></span><span class="row-r"><span class="sev sev-${x.sev}">${x.sev}</span></span>
      <span class="row-tags">${st[x.status]}<span class="row-s" style="margin:0;align-self:center">${esc(x.note)}</span></span></a></li>`).join("")}</ul>` : emptyRow("진행 중인 케이스가 없습니다")}
  </section>`;
}
function cardSignals(s) {
  const G = DATA.signals, z = s === "empty";
  return `<section class="kcard k-sig">${head("signals", "inbox", "inbox.html")}
    <div class="kc-num"><b>${z ? 0 : G.count}</b><span>${esc(G.window)}</span></div>
    <div class="kc-tags">${pv("untrusted", "에이전트가 검증 전", "sm")}</div>
    <div class="kinds">${G.kinds.map(([k, l, n]) => { const v = z ? 0 : n; return `<div class="kind-t${v ? "" : " zero"}"><span>${ic(LABELS.kindIcon[k])}${esc(l)}</span><b>${v}</b></div>`; }).join("")}</div>
    ${z ? emptyRow("새 신호가 없습니다") : `<ul class="rows">${G.latest.map(x => `<li><a class="row" href="inbox.html"><span><span class="row-s">${esc(x.t)} · ${esc(x.kind)} · ${esc(x.src)}</span><span class="row-t">${esc(x.title)}</span></span>${ic("chev")}</a></li>`).join("")}</ul>`}
  </section>`;
}
function cardKnowledge(s) {
  const K = DATA.knowledge;
  if (s === "error") return `<section class="kcard k-kn">${head("knowledge", "knowledge", "knowledge.html")}
    <div class="alert alert-error kc-err">${ic("alert")}<div><b>커버리지를 불러오지 못했습니다 · 503</b><p>지식 저장소 응답 없음. 다른 카드는 정상입니다.</p><div style="margin-top:10px"><button class="btn btn-sm" data-act="retry">${ic("retry")}다시 시도</button></div></div></div></section>`;
  const r = s === "empty" ? { ready: 0, review: 0, none: K.total } : K;
  const pct = Math.round(r.ready / K.total * 100);
  const w = n => (n / K.total * 100).toFixed(1) + "%";
  return `<section class="kcard k-kn">${head("knowledge", "knowledge", "knowledge.html")}
    <div class="kc-num"><b>${pct}%</b><span>${r.ready}/${K.total} 대상 판단 가능</span></div>
    <div class="cov">
      <div class="cov-bar" role="img" aria-label="판단 가능 ${r.ready}, 검수 중 ${r.review}, 미온보딩 ${r.none}"><i class="cov-ok" style="width:${w(r.ready)}"></i><i class="cov-rv" style="width:${w(r.review)}"></i><i class="cov-no" style="width:${w(r.none)}"></i></div>
      <div class="cov-leg">${pv("approved", null, "sm")}<span>${esc(LABELS.cov.ready)}</span><b>${r.ready}</b>${pv("draft", null, "sm")}<span>${esc(LABELS.cov.review)}</span><b>${r.review}</b>${pv("untrusted", null, "sm")}<span>${esc(LABELS.cov.none)}</span><b>${r.none}</b></div>
      ${s === "empty" ? "" : `<p class="cov-note">${ic("info")}<span>검수 대기 문서 ${K.docsPending} · ${esc(K.pendingDoc)}. 승격 전 문서는 판단에 쓰지 않습니다.</span></p>`}
    </div></section>`;
}

function renderPage() {
  const s = APP.state, H = DATA.home, el = $("#home");
  const top = `<div class="home-h"><h1>${esc(LABELS.home)}</h1><div class="home-meta"><span><b>${esc(H.site)}</b></span><span>${esc(H.date)}</span><span>${esc(H.shift)}</span><span>갱신 <b>${esc(H.updated)}</b></span></div></div>`;
  if (s === "loading") { el.innerHTML = top + `<div class="grid">${["k-ap", "k-bk", "k-case", "k-sig", "k-kn"].map(k => `<div class="${k}">${sk(k === "k-ap" ? 340 : 280)}</div>`).join("")}</div>`; return; }
  const alert = s === "blocked" ? `<div class="alert alert-blocked" role="alert">${ic("ban")}<div><b>방금 정책 차단 · 주입 공격 의심</b><p>${esc(DATA.blockedExtra.t)} ${esc(DATA.blockedExtra.tool)} · ${esc(DATA.blockedExtra.why)}. <a href="audit.html?filter=blocked">감사 기록 보기</a></p></div></div>`
    : s === "error" ? `<div class="alert alert-error" role="alert">${ic("alert")}<div><b>일부 데이터를 불러오지 못했습니다</b><p>지식 커버리지 카드만 영향을 받았습니다.</p></div></div>`
    : s === "empty" ? `<div class="alert alert-ok" role="status">${ic("check")}<div><b>처리할 항목이 없습니다</b><p>새 신호가 들어오면 에이전트가 케이스를 열고 이 화면에 표시합니다.</p></div></div>` : "";
  el.innerHTML = top + alert + `<div class="grid">${cardApprovals(s)}${cardBlocked(s)}${cardCases(s)}${cardSignals(s)}${cardKnowledge(s)}</div>`;
}
const PAGE_ACTS = { retry: () => { setState("loading"); setTimeout(() => setState("normal"), 800); } };

initTheme(); readURL();
renderShell([LABELS.nav.home]);
renderDemo(); bindActs(PAGE_ACTS); renderPage();
