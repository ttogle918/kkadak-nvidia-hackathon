# OpenShell 샌드박스 정책 템플릿 — 기본 전부 차단 (MaintQ D143 에서 가져온 패턴)
#
# 원칙
#   1. network_policies 는 비워 둔다. 허용은 필요가 생길 때 항목 단위로 추가한다.
#   2. NVIDIA 추론은 게이트웨이의 inference.local 경유 — 정책에 적지 않는다.
#      게이트웨이가 가로채 키를 주입하므로 샌드박스 안에는 키가 없다.
#   3. 파일시스템은 /tmp 만 쓰기 가능. 앱 코드(/app)는 읽기 전용.
#
# 스키마: https://docs.nvidia.com/openshell/reference/policy-schema
#   - filesystem_policy / landlock / process 는 생성 시 고정 (바꾸려면 샌드박스 재생성)
#   - network_policies 는 hot-reload: `openshell policy set <name> --policy deploy/openshell/policy.yaml`
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /app
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: "1000"
  run_as_group: "1000"

network_policies:
  # 카카오맵 MCP (PlayMCP) — 이야기 길의 도보 경로·장소 검색 전용 (AGENT_CONTEXT 3.3 공유 자원)
  #   이유: 네이버 Directions 는 자동차 전용이라 도보에 못 쓴다. 카카오맵 MCP 가 도보 경로(GetWalkDirections)와
  #         장소 검색(SearchPlaceByKeywordOpen)을 준다. 지도 MCP 는 이 두 도구만 연다(protocol: mcp, tools/call 단위).
  #   근거: 엔드포인트 https://playmcp.kakao.com/mcp (streamable HTTP, OAuth) — 웹 검색 결과 기준.
  #   실측: [미실측] 샌드박스에서 `openshell logs <name> --tail --source sandbox` 로 ALLOWED/DENIED 를 확인한 뒤
  #         이 주석에 날짜와 결과를 적는다 (CLAUDE.md 절대 규칙 2).
  #   확인 필요:
  #     - 도구 이름: 2026-10-07 Claude Code 에서 PlayMCP 도구 목록으로 확인한 이름이다(KakaoMap-GetWalkDirections 등).
  #       샌드박스 안 호출(tools/call)의 ALLOWED/DENIED 는 아직 아니다.
  #     - initialize·tools/list 등 수명주기 메서드가 tools/call 규칙만으로 통과하는지 (문서 예시는 tools/call 규칙만 있음).
  #     - OAuth 로그인은 호스트(브라우저)에서 한다. 인증 흐름의 다른 호스트(kauth.kakao.com 등)는 샌드박스에 열지 않는다.
  #       토큰은 게이트웨이 provider 에만 둔다(D1). 샌드박스에서 토큰을 어떻게 주입할지는 미정.
  #     - binaries: 호출 프로세스의 실제 경로(심볼릭 링크 아님). 아래는 python3.12 가정.
  kakaomap_mcp:
    name: kakaomap_mcp
    endpoints:
      - host: playmcp.kakao.com
        port: 443
        protocol: mcp
        enforcement: enforce
        rules:
          - allow: { method: tools/call, tool: KakaoMap-GetWalkDirections }
          - allow: { method: tools/call, tool: KakaoMap-SearchPlaceByKeywordOpen }
    binaries:
      - { path: /usr/bin/python3.12 }
