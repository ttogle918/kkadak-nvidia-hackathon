# OpenShell 샌드박스 정책 템플릿 — 기본 전부 차단 (MaintQ D143 에서 가져온 패턴)
#
# 원칙
#   1. network_policies 는 비워 둔다. 허용은 필요가 생길 때 항목 단위로 추가한다.
#   2. NVIDIA 추론은 게이트웨이의 inference.local 경유 — 정책에 적지 않는다.
#      게이트웨이가 가로채 키를 주입하므로 샌드박스 안에는 키가 없다.
#   3. 파일시스템은 /tmp 만 쓰기 가능. 앱 코드(/app)는 읽기 전용.
#
# 스키마: https://docs.nvidia.com/openshell/reference/policy-schema
#   - filesystem_policy / landlock / process 는 생성 시 고정 (바꾸려면 샌드박스 재생성)
#   - network_policies 는 hot-reload: `openshell policy set <name> --policy deploy/openshell/policy.yaml`
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /app
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: "1000"
  run_as_group: "1000"

network_policies: {}
